# Harness evals — measures the .claude/ skills, agents and AGENTS.md routing, per PR, selectively.
#
#   quality   eval:quality — static SKILL.md gate, no model, no secret. BLOCKING.
#   changes   scripts/ci-detect.mjs maps the PR diff onto suites:
#               a changed skill    → that skill's evals    (content tier)
#               a changed agent    → that agent's evals    (tool tier) + the workflow tier
#               AGENTS.md/CLAUDE.md, workflow cases, the engine → the workflow tier
#             A changed artifact with no evals is logged as SKIP, never a failure.
#   skills / agents / workflow
#             Model runs on OpenRouter. REPORT-ONLY (continue-on-error): every run uploads
#             results/ as an artifact and writes a step summary. Make a tier blocking only after
#             its baseline is calibrated on CI (see evals/README.md, "Which change → which run").
#
# Secrets: OPENROUTER_API_KEY is an Actions secret. Model jobs run only for PRs from this repo
# (never from a fork) and for manual runs — a fork PR gets the static gate only.
# Budget: paths filter + per-artifact selection + max 2 parallel matrix legs + EVAL_MAX_TURNS +
# job timeouts. Models are job-level knobs, overridable on a manual run.

name: evals

on:
  pull_request:
    paths:
      - '.claude/**'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - '*/AGENTS.md'
      - 'evals/**'
      - '.github/workflows/evals.yml'
  workflow_dispatch:
    inputs:
      skills_model:
        description: 'OpenRouter slug for the skills (content) tier'
        default: 'deepseek/deepseek-chat'
      tool_model:
        description: 'OpenRouter slug for the agents tier'
        default: 'anthropic/claude-haiku-4.5'
      workflow_model:
        description: 'OpenRouter slug for the workflow tier'
        default: 'google/gemini-2.5-flash'

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

env:
  EVAL_BACKEND: openrouter
  EVAL_MAX_TURNS: '25'
  EVAL_QUIET: '1'

jobs:
  # ── 0. Static gate — blocking, no model, no secret ─────────────────────────
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm eval:quality

  # ── 1. Detect which suites this PR should run ──────────────────────────────
  changes:
    # Never hand the secret-bearing jobs below a fork PR.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skills: ${{ steps.detect.outputs.skills }}
      agents: ${{ steps.detect.outputs.agents }}
      run_workflow: ${{ steps.detect.outputs.run_workflow }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        working-directory: evals
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # workflow_dispatch has no PR diff — treat everything since the root commit as changed.
          if [ -n "$BASE_SHA" ]; then RANGE="$BASE_SHA...HEAD"; else RANGE="$(git rev-list --max-parents=0 HEAD | tail -1)...HEAD"; fi
          CHANGED_FILES="$(git diff --name-only "$RANGE")"
          export CHANGED_FILES
          node scripts/ci-detect.mjs

  # ── 2. Skills — content tier, native OpenRouter, no proxy. Report-only ─────
  skills:
    needs: [quality, changes]
    if: needs.changes.outputs.skills != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        skill: ${{ fromJSON(needs.changes.outputs.skills) }}
    defaults:
      run:
        working-directory: evals
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EVAL_MODEL: ${{ inputs.skills_model || 'deepseek/deepseek-chat' }}
      EVAL_JUDGE_MODEL: ${{ inputs.skills_model || 'deepseek/deepseek-chat' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run "skills/${{ matrix.skill }}/" | tee results-summary.txt
      - if: always()
        run: |
          { echo "### skill: ${{ matrix.skill }}"; echo '```'; tail -40 results-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-skill-${{ matrix.skill }}
          path: evals/results/
          if-no-files-found: ignore

  # ── 3. Agents — tool tier, LiteLLM translating proxy. Report-only ─────────
  agents:
    needs: [quality, changes]
    if: needs.changes.outputs.agents != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        agent: ${{ fromJSON(needs.changes.outputs.agents) }}
    defaults:
      run:
        working-directory: evals
    env:
      OPENROUTER_BASE_URL: http://localhost:4000
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EVAL_MODEL: ${{ inputs.tool_model || 'anthropic/claude-haiku-4.5' }}
      EVAL_JUDGE_MODEL: ${{ inputs.tool_model || 'anthropic/claude-haiku-4.5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f proxy/docker-compose.yml up -d
      - run: pnpm proxy:wait
      # Anchored with a trailing slash so `architecture-reviewer/` does not also run `-lite`.
      - run: pnpm exec vitest run "agents/${{ matrix.agent }}/" --no-file-parallelism | tee results-summary.txt
      - if: always()
        run: |
          { echo "### agent: ${{ matrix.agent }}"; echo '```'; tail -40 results-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-agent-${{ matrix.agent }}
          path: evals/results/
          if-no-files-found: ignore
      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100
      - if: always()
        run: docker compose -f proxy/docker-compose.yml down

  # ── 4. Workflow — live-harness tier. Report-only: activation is "indicative" ─
  workflow:
    needs: [quality, changes]
    if: needs.changes.outputs.run_workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    defaults:
      run:
        working-directory: evals
    env:
      OPENROUTER_BASE_URL: http://localhost:4000
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EVAL_MODEL: ${{ inputs.workflow_model || 'google/gemini-2.5-flash' }}
      EVAL_JUDGE_MODEL: ${{ inputs.workflow_model || 'google/gemini-2.5-flash' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f proxy/docker-compose.yml up -d
      - run: pnpm proxy:wait
      - run: pnpm exec vitest run workflow --no-file-parallelism | tee results-summary.txt
      - if: always()
        run: |
          { echo "### workflow tier"; echo '```'; tail -60 results-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-workflow
          path: evals/results/
          if-no-files-found: ignore
      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100
      - if: always()
        run: docker compose -f proxy/docker-compose.yml down
