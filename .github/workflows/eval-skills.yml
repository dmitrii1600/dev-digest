# eval-skills - harness evals for .claude/skills
#
#   quality  eval:quality (static SKILL.md gate) + evals typecheck. No model, no secret. BLOCKING.
#   skills   eval:skills for each changed skill that has evals - content tier, native OpenRouter.
#
# Triggers on pull_request and on push to main, only when one of the paths below changes,
# and then runs only the artifacts that changed AND have an evals/<tier>/<name>/*.eval.ts
# (evals/scripts/ci-detect.mjs). A changed artifact without evals is logged as SKIP.
# Model jobs are REPORT-ONLY (continue-on-error) until their baseline is calibrated on CI.
# Secrets: OPENROUTER_API_KEY is an Actions secret; a fork PR never reaches the model jobs.

name: eval-skills

on:
  pull_request:
    paths:
      - '.claude/skills/**'
      - 'evals/skills/**'
      - 'evals/src/**'
      - 'evals/package.json'
      - '.github/workflows/eval-skills.yml'
  push:
    branches: [main]
    paths:
      - '.claude/skills/**'
      - 'evals/skills/**'
      - 'evals/src/**'
      - 'evals/package.json'
      - '.github/workflows/eval-skills.yml'
  workflow_dispatch:
    inputs:
      skills_model:
        description: 'OpenRouter slug for the skills (content) tier'
        default: 'deepseek/deepseek-chat'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EVAL_BACKEND: openrouter
  EVAL_MAX_TURNS: '25'
  EVAL_QUIET: '1'

jobs:
  # -- Static gate - blocking, no model, no secret ----------------------------
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm eval:quality

  # -- Detect which suites this change should run ------------------------------
  changes:
    # Never hand the secret-bearing jobs below a fork PR.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skills: ${{ steps.detect.outputs.skills }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        working-directory: evals
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # pull_request: the PR diff. push: the pushed range (a new branch has an all-zero
          # "before", so fall back to the last commit). workflow_dispatch: everything.
          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT" = pull_request ]; then RANGE="$PR_BASE...HEAD"
          elif [ "$EVENT" = push ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$ZERO" ]; then RANGE="$PUSH_BEFORE...HEAD"
          elif [ "$EVENT" = push ]; then RANGE="HEAD~1...HEAD"
          else RANGE="$(git rev-list --max-parents=0 HEAD | tail -1)...HEAD"; fi
          CHANGED_FILES="$(git diff --name-only "$RANGE")"
          export CHANGED_FILES
          node scripts/ci-detect.mjs

  # -- Skills - content tier, native OpenRouter, no proxy. Report-only --------
  skills:
    needs: [quality, changes]
    if: needs.changes.outputs.skills != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        skill: ${{ fromJSON(needs.changes.outputs.skills) }}
    defaults:
      run:
        working-directory: evals
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EVAL_MODEL: ${{ inputs.skills_model || 'deepseek/deepseek-chat' }}
      EVAL_JUDGE_MODEL: ${{ inputs.skills_model || 'deepseek/deepseek-chat' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run "skills/${{ matrix.skill }}/" | tee results-summary.txt
      - if: always()
        run: |
          { echo "### skill: ${{ matrix.skill }}"; echo '```'; tail -40 results-summary.txt 2>/dev/null || echo "(no eval output - an earlier step failed, see the job log)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-skill-${{ matrix.skill }}
          path: evals/results/
          if-no-files-found: ignore
